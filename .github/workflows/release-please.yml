name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the tag and the GitHub release
  pull-requests: write # open and update the release pull request

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # RELEASE_PLEASE_TOKEN is a personal access token with contents and pull-requests write.
      # It must not be the default GITHUB_TOKEN: GitHub suppresses workflow runs for events raised
      # by GITHUB_TOKEN, so the tag this creates would never start the release workflow and nothing
      # would reach NuGet.org.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
