name: release

# Release Please derives the next version from the conventional commits on main and opens a release
# pull request. Merging it creates the tag and the GitHub release, and this same run then publishes.
#
# Publishing lives here rather than in a workflow triggered by the tag, because a tag created with
# the default GITHUB_TOKEN does not start a workflow run. Keeping both in one run means the default
# token is enough and no personal access token has to be stored.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the tag and the GitHub release, attach the packages
  issues: write # label the release pull request
  pull-requests: write # open and update the release pull request
  id-token: write # OIDC token for NuGet trusted publishing

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      # The run is triggered by a push to main; the release points at a tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify the NuGet user is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "::error::NUGET_USER is not set, so the OIDC login cannot run and this release would publish nothing. Add the NUGET_USER repository secret holding your nuget.org profile name, then run again."
            exit 1
          fi

      - name: Resolve version from the release tag
        id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::release tag '$TAG' is not a v* version tag"
            exit 1
          fi
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore cachew.slnx

      - name: Build
        run: dotnet build cachew.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test cachew.slnx --configuration Release --no-build -p:Version=${{ steps.version.outputs.value }}

      - name: Pack
        run: dotnet pack cachew.slnx --configuration Release --no-build -p:Version=${{ steps.version.outputs.value }} --output artifacts

      # Exchanges the GitHub OIDC token for a nuget.org API key that lives for one hour, so this runs
      # immediately before the push rather than earlier in the job.
      - name: NuGet login (OIDC to a temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.*

      # Release Please creates the release with the notes, so the packages are added to it rather
      # than used to create a second one.
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" artifacts/*.nupkg artifacts/*.snupkg --clobber
